version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
    volumes:
      - .:/app:Z
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
